<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phone">

  <title>Phone</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* FLITCH DYNAMIQUE */
    .wallpaper-zone {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      z-index: 0;
    }

    .wallpaper {
      position: absolute;
      top: 0;
      left: 50%;

      width: 164vw;
      height: 100dvh;

      transform: translateX(-50%);

      border: 0;
      margin: 0;
      padding: 0;
      display: block;
    }

    /* NOTRE INTERFACE MIX */
    .interface {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100dvh;

      object-fit: fill;

      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="wallpaper-zone">
    <iframe
      class="wallpaper"
      src="https://www.flitch.me/iframe.php?n=17726602048546"
      scrolling="no">
    </iframe>
  </div>

  <img
    class="interface"
    src="ios_mix_masked_v1.png"
    alt="">

</body>

</html>
