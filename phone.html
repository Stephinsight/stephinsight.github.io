<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phone">

  <title>Phone</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* FLITCH = LE FOND D'ÉCRAN */
    .wallpaper-zone {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      z-index: 0;
    }

    .wallpaper {
      position: absolute;
      top: 0;
      left: 50%;

      width: 164vw;
      height: 100dvh;

      transform: translateX(-50%);

      border: 0;
      margin: 0;
      padding: 0;
      display: block;
    }

    /* LÉGER ASSOMBRISSEMENT COMME UN LOCKSCREEN */
    .shade {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.12) 0%,
          rgba(0,0,0,0) 38%,
          rgba(0,0,0,.05) 100%
        );
    }

    /* HORLOGE */
    .clock {
      position: fixed;

      top: 54px;
      left: 50%;

      transform: translateX(-50%) scaleX(.72);
      transform-origin: center top;

      z-index: 5;

      color: rgba(255,255,255,.92);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      font-size: 142px;
      font-weight: 200;
      line-height: .95;

      letter-spacing: -8px;

      white-space: nowrap;

      text-shadow:
        0 1px 3px rgba(0,0,0,.10);

      pointer-events: none;
      user-select: none;
    }
  </style>
</head>

<body>

  <div class="wallpaper-zone">
    <iframe
      class="wallpaper"
      src="https://www.flitch.me/iframe.php?n=17726602048546"
      scrolling="no">
    </iframe>
  </div>

  <div class="shade"></div>

  <div id="clock" class="clock">00:00</div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      document.getElementById("clock").textContent =
        hours + ":" + minutes;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
